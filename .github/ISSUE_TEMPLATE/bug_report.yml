name: Bug report
description: Something in Lindale does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lindale version
      placeholder: 0.1.0-beta
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        Attach `%LOCALAPPDATA%\\Lindale\\logs\\latest.log` if you can.
        Check it first: never post cookies, tokens or e-mail addresses.

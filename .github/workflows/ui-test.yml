# End-to-end UI test on Linux (virtual screen, null audio sink, fake Discord): start it by hand from
# the Actions tab ("UI test"). Same script as locally: tools/ui-test/run.sh
name: UI test

on:
  workflow_dispatch:

jobs:
  ui-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb pulseaudio dbus dbus-x11 libvlc5 vlc-plugin-base ffmpeg stalonetray python3-xlib

      - name: Run
        run: sh tools/ui-test/run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-logs
          path: |
            logs/latest.log
            build/ui-test/app.log
          retention-days: 7

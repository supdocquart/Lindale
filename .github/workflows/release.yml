# Builds the Windows installer and portable zip on GitHub's Windows runner and publishes them as a
# GitHub release. Start it by pushing a tag like v0.1.0-beta (tags with "-" become pre-releases),
# or by hand from the Actions tab with a tag name.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0-beta)"
        required: true

permissions:
  contents: write

env:
  VLC_VERSION: "3.0.24"

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle VLC ${{ env.VLC_VERSION }}
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vlc.zip"
          Invoke-WebRequest "https://download.videolan.org/pub/videolan/vlc/$env:VLC_VERSION/win64/vlc-$env:VLC_VERSION-win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\vlc"
          New-Item -ItemType Directory -Force desktop/appResources/windows | Out-Null
          Move-Item "$env:RUNNER_TEMP\vlc\vlc-$env:VLC_VERSION" desktop/appResources/windows/vlc
          if (-not (Test-Path desktop/appResources/windows/vlc/libvlc.dll)) { throw "libvlc.dll missing" }

      - name: WiX Toolset 3 (needed by jpackage for the installer)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }
          $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
          if ($wix) { "$($wix.FullName)\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }

      - name: Build installer and app image
        shell: pwsh
        run: ./gradlew.bat :desktop:createDistributable :desktop:packageExe --no-configuration-cache --console=plain

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem desktop/build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/Lindale-setup.exe
          Compress-Archive -Path desktop/build/compose/binaries/main/app/Lindale -DestinationPath dist/Lindale-portable.zip -CompressionLevel Optimal
          Get-ChildItem dist | Format-Table Name, Length

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = ".github/release-notes/$env:TAG.md"
          if (-not (Test-Path $notes)) { $notes = ".github/release-notes/default.md" }
          $title = "Lindale " + $env:TAG.TrimStart("v")
          $flags = @()
          if ($env:TAG.Contains("-")) { $flags += "--prerelease" }
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist/Lindale-setup.exe dist/Lindale-portable.zip --clobber
          } else {
            gh release create $env:TAG dist/Lindale-setup.exe dist/Lindale-portable.zip --title $title --notes-file $notes --target $env:GITHUB_SHA @flags
          }

[versions]
koin = "4.0.0"
json = "20260814"
kotlin = "2.4.20"
lifecycle = "2.11.0"
room = "2.8.5"
ktor = "3.6.0"
ksp = "2.3.12"
coil = "3.6.3"
datastore = "1.2.1"
composeReorderable = "3.1.0"
materialKolor = "5.0.1"
kuromojiIpadic = "0.9.0"
innertubex = "v0.7.0"
tinypinyin = "2.0.3"
protobuf = "4.36.2"
jbrApi = "1.12.0"

[libraries]
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

compose-reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "composeReorderable" }

viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

materialKolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

json = { module = "org.json:json", version.ref = "json" }

innertubex = { module = "com.github.MetrolistGroup.innertubex:innertubex", version.ref = "innertubex" }

kuromoji-ipadic = { module = "com.atilika.kuromoji:kuromoji-ipadic", version.ref = "kuromojiIpadic" }
tinypinyin = { module = "com.github.promeG:tinypinyin", version.ref = "tinypinyin" }

protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }

# DESKTOP: JBR-specific APIs (custom title bar); on Maven Central as org.jetbrains.runtime:jbr-api.
jbr-api = { module = "org.jetbrains.runtime:jbr-api", version.ref = "jbrApi" }

[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

